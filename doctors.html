<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Doctors | AI-HMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="d-flex">
  <nav class="sidebar" style="width:250px;">
    <h5 class="text-white px-3 mb-4"><i class="bi bi-heart-pulse-fill"></i> AI-HMS</h5>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link active" href="doctors.html"><i class="bi bi-person-badge"></i> Manage Doctors</a></li>
      <li class="nav-item"><a class="nav-link" href="patients.html"><i class="bi bi-people"></i> Manage Patients</a></li>
      <li class="nav-item"><a class="nav-link" href="departments.html"><i class="bi bi-diagram-3"></i> Departments</a></li>
      <li class="nav-item"><a class="nav-link" href="billing.html"><i class="bi bi-receipt"></i> Billing</a></li>
      <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports & Analytics</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>
  </nav>

  <main class="flex-grow-1 p-4">
    <h4 class="mb-4">Manage Doctors</h4>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-active">Active</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pending">Pending Approval</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-active">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Name</th><th>Department</th><th>Fee</th><th>Experience</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="active-body"><tr><td colspan="6" class="text-center text-muted-sm">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="tab-pane fade" id="tab-pending">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Qualification</th><th>Action</th></tr></thead>
              <tbody id="pending-body"><tr><td colspan="5" class="text-center text-muted-sm">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
requireRole("admin");

async function loadActive() {
  try {
    const res = await API.listAllDoctors("active");
    document.getElementById("active-body").innerHTML = res.doctors.length
      ? res.doctors.map(d => `
        <tr>
          <td>${d.name}</td><td>${d.department}</td><td>₹${d.consultation_fee}</td><td>${d.experience_years} yrs</td>
          <td><span class="badge bg-success">active</span></td>
          <td>
            <button class="btn btn-sm btn-outline-warning" onclick="blockDoctor('${d._id}')">Block</button>
            <button class="btn btn-sm btn-outline-danger" onclick="removeDoctor('${d._id}')">Remove</button>
          </td>
        </tr>`).join("")
      : `<tr><td colspan="6" class="text-center text-muted-sm">No active doctors</td></tr>`;
  } catch (err) { showToast(err.message, "error"); }
}

async function loadPending() {
  try {
    const res = await API.listAllDoctors("pending");
    document.getElementById("pending-body").innerHTML = res.doctors.length
      ? res.doctors.map(d => `
        <tr>
          <td>${d.name}</td><td>${d.email}</td><td>${d.department}</td><td>${d.qualification || "-"}</td>
          <td><button class="btn btn-sm btn-success" onclick="approveDoctor('${d._id}')">Approve</button></td>
        </tr>`).join("")
      : `<tr><td colspan="5" class="text-center text-muted-sm">No pending approvals</td></tr>`;
  } catch (err) { showToast(err.message, "error"); }
}

async function approveDoctor(id) {
  try { await API.approveDoctor(id); showToast("Doctor approved"); loadPending(); loadActive(); }
  catch (err) { showToast(err.message, "error"); }
}
async function blockDoctor(id) {
  if (!confirm("Block this doctor's account?")) return;
  try { await API.blockDoctor(id); showToast("Doctor blocked"); loadActive(); }
  catch (err) { showToast(err.message, "error"); }
}
async function removeDoctor(id) {
  if (!confirm("Permanently remove this doctor?")) return;
  try { await API.removeDoctor(id); showToast("Doctor removed"); loadActive(); }
  catch (err) { showToast(err.message, "error"); }
}

loadActive();
loadPending();
</script>
</body>
</html>
