<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments | AI-HMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="d-flex">
  <nav class="sidebar" style="width:250px;">
    <h5 class="text-white px-3 mb-4"><i class="bi bi-heart-pulse-fill"></i> AI-HMS</h5>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="doctors.html"><i class="bi bi-person-badge"></i> Manage Doctors</a></li>
      <li class="nav-item"><a class="nav-link" href="patients.html"><i class="bi bi-people"></i> Manage Patients</a></li>
      <li class="nav-item"><a class="nav-link active" href="departments.html"><i class="bi bi-diagram-3"></i> Departments</a></li>
      <li class="nav-item"><a class="nav-link" href="billing.html"><i class="bi bi-receipt"></i> Billing</a></li>
      <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports & Analytics</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>
  </nav>

  <main class="flex-grow-1 p-4">
    <h4 class="mb-4">Departments</h4>
    <div class="row g-3" id="dept-cards">
      <p class="text-muted-sm ps-2">Loading...</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
requireRole("admin");

async function loadDepartments() {
  try {
    const res = await API.listDepartments();
    const container = document.getElementById("dept-cards");
    container.innerHTML = res.departments.length
      ? res.departments.map(d => `
        <div class="col-md-4">
          <div class="card p-3">
            <div class="d-flex align-items-center gap-3">
              <div class="stat-icon bg-primary"><i class="bi bi-diagram-3"></i></div>
              <div>
                <h6 class="mb-0">${d.name}</h6>
                <span class="text-muted-sm">${d.doctor_count} doctor(s)</span>
              </div>
            </div>
          </div>
        </div>`).join("")
      : `<p class="text-muted-sm ps-2">No departments yet — approve doctors to populate this list.</p>`;
  } catch (err) { showToast(err.message, "error"); }
}
loadDepartments();
</script>
</body>
</html>
