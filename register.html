<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | AI-HMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper py-5">
  <div class="auth-card bg-white row g-0">
    <div class="col-md-5 auth-side">
      <h2 class="fw-bold mb-3"><i class="bi bi-heart-pulse-fill"></i> AI-HMS</h2>
      <p>Create your account to book appointments, chat with the AI symptom checker, and manage your health records digitally.</p>
      <hr class="border-light opacity-25">
      <p class="small">Note: Doctor accounts require admin approval before login is enabled.</p>
    </div>
    <div class="col-md-7 p-5">
      <h4 class="fw-bold mb-4">Create an account</h4>
      <div id="alert-box" class="alert alert-danger d-none"></div>

      <div class="mb-3">
        <label class="form-label">I am a</label>
        <select class="form-select" id="role">
          <option value="patient" selected>Patient</option>
          <option value="doctor">Doctor</option>
        </select>
      </div>

      <form id="register-form">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" minlength="6" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone">
          </div>
        </div>

        <div id="patient-fields" class="row g-3 mt-1">
          <div class="col-md-4">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" id="age" min="0">
          </div>
          <div class="col-md-4">
            <label class="form-label">Gender</label>
            <select class="form-select" id="gender">
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Blood Group</label>
            <input type="text" class="form-control" id="blood_group" placeholder="e.g. O+">
          </div>
        </div>

        <div id="doctor-fields" class="row g-3 mt-1 d-none">
          <div class="col-md-6">
            <label class="form-label">Department</label>
            <select class="form-select" id="department">
              <option>General Physician</option>
              <option>Cardiologist</option>
              <option>Dermatologist</option>
              <option>Pulmonologist</option>
              <option>Neurologist</option>
              <option>Gastroenterologist</option>
              <option>Orthopedic</option>
              <option>ENT Specialist</option>
              <option>Endocrinologist</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" id="qualification" placeholder="e.g. MBBS, MD">
          </div>
          <div class="col-md-6">
            <label class="form-label">Experience (years)</label>
            <input type="number" class="form-control" id="experience_years" min="0">
          </div>
          <div class="col-md-6">
            <label class="form-label">Consultation Fee (₹)</label>
            <input type="number" class="form-control" id="consultation_fee" min="0" value="300">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4" id="register-btn">Create Account</button>
      </form>
      <p class="text-center mt-4 mb-0 text-muted-sm">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
const roleSelect = document.getElementById("role");
const patientFields = document.getElementById("patient-fields");
const doctorFields = document.getElementById("doctor-fields");

roleSelect.addEventListener("change", () => {
  const isDoctor = roleSelect.value === "doctor";
  patientFields.classList.toggle("d-none", isDoctor);
  doctorFields.classList.toggle("d-none", !isDoctor);
});

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("alert-box");
  const btn = document.getElementById("register-btn");
  alertBox.classList.add("d-none");
  btn.disabled = true;
  btn.textContent = "Creating account...";

  const role = roleSelect.value;
  const payload = {
    role,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    phone: document.getElementById("phone").value,
  };

  if (role === "patient") {
    Object.assign(payload, {
      age: document.getElementById("age").value || null,
      gender: document.getElementById("gender").value,
      blood_group: document.getElementById("blood_group").value,
    });
  } else {
    Object.assign(payload, {
      department: document.getElementById("department").value,
      qualification: document.getElementById("qualification").value,
      experience_years: document.getElementById("experience_years").value || 0,
      consultation_fee: document.getElementById("consultation_fee").value || 300,
    });
  }

  try {
    const res = await API.register(payload);
    if (role === "doctor") {
      alertBox.className = "alert alert-success";
      alertBox.textContent = res.message;
      alertBox.classList.remove("d-none");
      document.getElementById("register-form").reset();
    } else {
      saveSession(res.token, res.user);
      window.location.href = "patient/dashboard.html";
    }
  } catch (err) {
    alertBox.className = "alert alert-danger";
    alertBox.textContent = err.message;
    alertBox.classList.remove("d-none");
  } finally {
    btn.disabled = false;
    btn.textContent = "Create Account";
  }
});
</script>
</body>
</html>
