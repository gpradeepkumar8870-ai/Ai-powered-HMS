<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports & Analytics | AI-HMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="d-flex">
  <nav class="sidebar" style="width:250px;">
    <h5 class="text-white px-3 mb-4"><i class="bi bi-heart-pulse-fill"></i> AI-HMS</h5>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="doctors.html"><i class="bi bi-person-badge"></i> Manage Doctors</a></li>
      <li class="nav-item"><a class="nav-link" href="patients.html"><i class="bi bi-people"></i> Manage Patients</a></li>
      <li class="nav-item"><a class="nav-link" href="departments.html"><i class="bi bi-diagram-3"></i> Departments</a></li>
      <li class="nav-item"><a class="nav-link" href="billing.html"><i class="bi bi-receipt"></i> Billing</a></li>
      <li class="nav-item"><a class="nav-link active" href="reports.html"><i class="bi bi-bar-chart"></i> Reports & Analytics</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>
  </nav>

  <main class="flex-grow-1 p-4">
    <h4 class="mb-4">Reports & Analytics</h4>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="stat-card"><div class="stat-value" id="r-total-appts">-</div><div class="text-muted-sm">Total Appointments</div></div>
      </div>
      <div class="col-md-3">
        <div class="stat-card"><div class="stat-value" id="r-total-revenue">-</div><div class="text-muted-sm">Total Revenue</div></div>
      </div>
      <div class="col-md-3">
        <div class="stat-card"><div class="stat-value" id="r-pending-bills">-</div><div class="text-muted-sm">Pending Bills</div></div>
      </div>
      <div class="col-md-3">
        <div class="stat-card"><div class="stat-value" id="r-departments">-</div><div class="text-muted-sm">Departments</div></div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card p-3">
          <h6 class="fw-bold mb-3">7-Day Appointment Trend</h6>
          <canvas id="trendChart" height="150"></canvas>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card p-3">
          <h6 class="fw-bold mb-3">Department-wise Appointment Load</h6>
          <canvas id="deptChart" height="150"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
requireRole("admin");

async function loadReports() {
  try {
    const [statsRes, trendRes, deptRes] = await Promise.all([
      API.adminStats(), API.appointmentsTrend(), API.departmentLoad(),
    ]);

    document.getElementById("r-total-appts").textContent = statsRes.stats.total_appointments;
    document.getElementById("r-total-revenue").textContent = "₹" + statsRes.stats.revenue_total.toLocaleString("en-IN");
    document.getElementById("r-pending-bills").textContent = statsRes.stats.pending_bills;
    document.getElementById("r-departments").textContent = statsRes.stats.total_departments;

    new Chart(document.getElementById("trendChart"), {
      type: "bar",
      data: { labels: trendRes.labels, datasets: [{ label: "Appointments", data: trendRes.counts, backgroundColor: "#4f46e5" }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } },
    });

    new Chart(document.getElementById("deptChart"), {
      type: "pie",
      data: {
        labels: deptRes.labels,
        datasets: [{ data: deptRes.counts, backgroundColor: ["#4f46e5","#06b6d4","#16a34a","#f59e0b","#dc2626","#7c3aed","#ea580c","#0ea5e9","#84cc16"] }],
      },
    });
  } catch (err) { showToast(err.message, "error"); }
}
loadReports();
</script>
</body>
</html>
