<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical History | AI-HMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="d-flex">
  <nav class="sidebar" style="width:250px;">
    <h5 class="text-white px-3 mb-4"><i class="bi bi-heart-pulse-fill"></i> AI-HMS</h5>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
      <li class="nav-item"><a class="nav-link" href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a></li>
      <li class="nav-item"><a class="nav-link" href="symptom-checker.html"><i class="bi bi-robot"></i> AI Symptom Checker</a></li>
      <li class="nav-item"><a class="nav-link active" href="medical-history.html"><i class="bi bi-file-earmark-medical"></i> Medical History</a></li>
      <li class="nav-item"><a class="nav-link" href="billing.html"><i class="bi bi-receipt"></i> Billing</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>
  </nav>

  <main class="flex-grow-1 p-4">
    <h4 class="mb-4">Medical History</h4>

    <ul class="nav nav-tabs mb-3" id="historyTabs">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-visits">Past Visits</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-labs">Lab Reports</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ai">AI Symptom Checks</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-visits">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Date</th><th>Doctor</th><th>Department</th><th>Status</th></tr></thead>
              <tbody id="visits-body"><tr><td colspan="4" class="text-center text-muted-sm">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-labs">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Test</th><th>Date</th><th>Report</th></tr></thead>
              <tbody id="labs-body"><tr><td colspan="3" class="text-center text-muted-sm">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-ai">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Date</th><th>Symptoms</th><th>Top Prediction</th><th>Risk</th></tr></thead>
              <tbody id="ai-body"><tr><td colspan="4" class="text-center text-muted-sm">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/chatbot.js"></script>
<script>
requireRole("patient");
initChatbot();

async function loadHistory() {
  try {
    const res = await API.medicalHistory();

    document.getElementById("visits-body").innerHTML = res.past_appointments.length
      ? res.past_appointments.map(a => `<tr><td>${formatDate(a.date)}</td><td>${a.doctor_id}</td><td>${a.department}</td><td>${statusBadge(a.status)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="text-center text-muted-sm">No past visits</td></tr>`;

    document.getElementById("labs-body").innerHTML = res.lab_reports.length
      ? res.lab_reports.map(r => `<tr><td>${r.test_name}</td><td>${formatDate(r.created_at)}</td><td><a href="http://localhost:5000/api/lab/reports/${r.filename}" target="_blank" class="btn btn-sm btn-outline-primary">Download</a></td></tr>`).join("")
      : `<tr><td colspan="3" class="text-center text-muted-sm">No lab reports uploaded yet</td></tr>`;

    document.getElementById("ai-body").innerHTML = res.ai_symptom_checks.length
      ? res.ai_symptom_checks.map(c => `<tr><td>${formatDate(c.created_at)}</td><td>${c.symptoms.map(labelize).join(", ")}</td><td>${c.predictions[0]?.disease || "-"}</td><td>${riskBadge(c.risk_level)}</td></tr>`).join("")
      : `<tr><td colspan="4" class="text-center text-muted-sm">No AI symptom checks yet</td></tr>`;
  } catch (err) {
    showToast(err.message, "error");
  }
}
function labelize(s) { return s.split("_").map(w => w[0].toUpperCase() + w.slice(1)).join(" "); }
loadHistory();
</script>
</body>
</html>
