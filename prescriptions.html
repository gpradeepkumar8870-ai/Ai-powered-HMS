<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescriptions | AI-HMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="d-flex">
  <nav class="sidebar" style="width:250px;">
    <h5 class="text-white px-3 mb-4"><i class="bi bi-heart-pulse-fill"></i> AI-HMS</h5>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
      <li class="nav-item"><a class="nav-link active" href="prescriptions.html"><i class="bi bi-capsule"></i> Prescriptions</a></li>
      <li class="nav-item"><a class="nav-link" href="symptom-checker.html"><i class="bi bi-robot"></i> AI Symptom Checker</a></li>
      <li class="nav-item"><a class="nav-link" href="medical-history.html"><i class="bi bi-file-earmark-medical"></i> Medical History</a></li>
      <li class="nav-item"><a class="nav-link" href="billing.html"><i class="bi bi-receipt"></i> Billing</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
    </ul>
  </nav>

  <main class="flex-grow-1 p-4">
    <h4 class="mb-4">My Prescriptions</h4>
    <div id="prescriptions-list" class="row g-3">
      <p class="text-muted-sm ps-2">Loading...</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/chatbot.js"></script>
<script>
requireRole("patient");
initChatbot();

async function loadPrescriptions() {
  try {
    const res = await API.myPrescriptions();
    const container = document.getElementById("prescriptions-list");
    if (res.prescriptions.length === 0) {
      container.innerHTML = `<p class="text-muted-sm ps-2">No prescriptions yet.</p>`;
      return;
    }
    container.innerHTML = res.prescriptions.map(p => `
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <div class="d-flex justify-content-between">
            <h6 class="fw-bold">${p.diagnosis}</h6>
            <span class="text-muted-sm">${formatDate(p.created_at)}</span>
          </div>
          <p class="text-muted-sm mb-2">Prescribed by ${p.doctor_name}</p>
          <ul class="list-group list-group-flush">
            ${p.medicines.map(m => `
              <li class="list-group-item px-0">
                <strong>${m.name}</strong> — ${m.dosage}, ${m.frequency}, for ${m.duration}
              </li>`).join("")}
          </ul>
          ${p.notes ? `<p class="text-muted-sm mt-2 mb-0"><i class="bi bi-info-circle"></i> ${p.notes}</p>` : ""}
        </div>
      </div>`).join("");
  } catch (err) {
    showToast(err.message, "error");
  }
}
loadPrescriptions();
</script>
</body>
</html>
